<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — เว็บรวมกิจกรรมจิตอาสา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/styles/tailwind-config.js"></script>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/accessibility.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    table { border-collapse: collapse; }
    th, td { text-align: left; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary-600 text-white px-4 py-2 rounded-lg z-50">
    ข้ามไปที่เนื้อหาหลัก
  </a>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const CATEGORY_LABELS = {
      environment: 'สิ่งแวดล้อม', education: 'การศึกษา', health: 'สุขภาพ', community: 'ชุมชน',
      disaster_relief: 'บรรเทาสาธารณภัย', animal_welfare: 'สวัสดิภาพสัตว์', other: 'อื่นๆ',
    };
    const ACTIVITY_STATUS = ['draft', 'open', 'closed', 'ongoing', 'completed', 'cancelled'];
    const ACTIVITY_STATUS_LABEL = {
      draft: 'ร่าง', open: 'เปิดรับสมัคร', closed: 'ปิดรับสมัคร', ongoing: 'กำลังดำเนินการ',
      completed: 'เสร็จสิ้น', cancelled: 'ยกเลิก',
    };
    const REG_STATUS_LABEL = {
      pending: 'รอการอนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ถูกปฏิเสธ',
      cancelled: 'ยกเลิกแล้ว', attended: 'เข้าร่วมสำเร็จ', no_show: 'ไม่มาเข้าร่วม',
    };

    function Toast({ message, type, onClose }) {
      if (!message) return null;
      React.useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [message]);
      return (
        <div className={`fixed bottom-6 right-6 z-50 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'} text-white px-5 py-3 rounded-xl shadow-lg text-sm`}>
          {message}
        </div>
      );
    }

    function TabButton({ active, onClick, children }) {
      return (
        <button onClick={onClick}
          className={`px-4 py-2.5 text-sm font-medium border-b-2 transition whitespace-nowrap ${active ? 'border-primary-600 text-primary-700' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
          {children}
        </button>
      );
    }

    // ───────────────────────── Activities Tab ─────────────────────────
    function ActivityFormModal({ activity, onClose, onSaved, notify }) {
      const isEdit = !!activity;
      const [form, setForm] = useState(activity || {
        Title: '', Description: '', Category: 'other', OrganizerName: '', Location: '',
        LocationLat: '', LocationLng: '', StartDate: '', EndDate: '', StartTime: '', EndTime: '',
        MaxParticipants: '', HoursAwarded: 0, Status: 'draft',
      });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const save = async () => {
        setLoading(true); setError('');
        try {
          const payload = {
            ...form,
            LocationLat: form.LocationLat === '' ? null : Number(form.LocationLat),
            LocationLng: form.LocationLng === '' ? null : Number(form.LocationLng),
            MaxParticipants: form.MaxParticipants === '' ? null : Number(form.MaxParticipants),
            HoursAwarded: Number(form.HoursAwarded) || 0,
          };
          if (isEdit) {
            await apiFetch(`/api/activities/${activity.ActivityID}`, { method: 'PATCH', body: payload });
          } else {
            await apiFetch('/api/activities', { method: 'POST', body: payload });
          }
          notify(isEdit ? 'แก้ไขกิจกรรมสำเร็จ' : 'สร้างกิจกรรมสำเร็จ');
          onSaved();
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full border border-slate-200 p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex items-start justify-between mb-4">
              <h3 className="text-lg font-semibold text-gray-900">{isEdit ? 'แก้ไขกิจกรรม' : 'สร้างกิจกรรมใหม่'}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600" aria-label="ปิด">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            {error && <div className="mb-4 text-sm text-red-600 bg-red-50 rounded-lg p-3">{error}</div>}

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="sm:col-span-2">
                <label className="text-sm text-gray-600">ชื่อกิจกรรม *</label>
                <input value={form.Title} onChange={e => set('Title', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div className="sm:col-span-2">
                <label className="text-sm text-gray-600">รายละเอียด</label>
                <textarea value={form.Description || ''} onChange={e => set('Description', e.target.value)} rows={3}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">หมวดหมู่</label>
                <select value={form.Category} onChange={e => set('Category', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm">
                  {Object.entries(CATEGORY_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                </select>
              </div>
              <div>
                <label className="text-sm text-gray-600">สถานะ</label>
                <select value={form.Status} onChange={e => set('Status', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm">
                  {ACTIVITY_STATUS.map(s => <option key={s} value={s}>{ACTIVITY_STATUS_LABEL[s]}</option>)}
                </select>
              </div>
              <div>
                <label className="text-sm text-gray-600">ชื่อผู้จัด/หน่วยงาน</label>
                <input value={form.OrganizerName || ''} onChange={e => set('OrganizerName', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">สถานที่</label>
                <input value={form.Location || ''} onChange={e => set('Location', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">พิกัด Latitude</label>
                <input value={form.LocationLat ?? ''} onChange={e => set('LocationLat', e.target.value)}
                  placeholder="เช่น 13.8199" className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">พิกัด Longitude</label>
                <input value={form.LocationLng ?? ''} onChange={e => set('LocationLng', e.target.value)}
                  placeholder="เช่น 100.5142" className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">วันที่เริ่ม *</label>
                <input type="date" value={form.StartDate || ''} onChange={e => set('StartDate', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">วันที่สิ้นสุด *</label>
                <input type="date" value={form.EndDate || ''} onChange={e => set('EndDate', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">เวลาเริ่ม</label>
                <input type="time" value={form.StartTime || ''} onChange={e => set('StartTime', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">เวลาสิ้นสุด</label>
                <input type="time" value={form.EndTime || ''} onChange={e => set('EndTime', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">จำนวนรับสูงสุด (ว่าง = ไม่จำกัด)</label>
                <input type="number" min="0" value={form.MaxParticipants ?? ''} onChange={e => set('MaxParticipants', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
              <div>
                <label className="text-sm text-gray-600">ชั่วโมงจิตอาสาที่ได้รับ</label>
                <input type="number" step="0.5" min="0" value={form.HoursAwarded} onChange={e => set('HoursAwarded', e.target.value)}
                  className="mt-1 w-full rounded-xl border border-gray-300 p-2.5 text-sm" />
              </div>
            </div>

            <button onClick={save} disabled={loading || !form.Title || !form.StartDate || !form.EndDate}
              className="mt-6 w-full rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 transition disabled:opacity-50">
              {loading ? 'กำลังบันทึก...' : 'บันทึกกิจกรรม'}
            </button>
          </div>
        </div>
      );
    }

    function ActivitiesTab({ notify }) {
      const [activities, setActivities] = useState([]);
      const [editing, setEditing] = useState(null);
      const [showForm, setShowForm] = useState(false);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        const data = await apiFetch('/api/activities?status=draft').catch(() => []);
        const data2 = await apiFetch('/api/activities');
        // รวม draft (ที่ query ปกติซ่อนไว้) เข้ากับรายการทั้งหมด แบบไม่ซ้ำ
        const merged = [...data, ...data2].filter((a, i, arr) => arr.findIndex(x => x.ActivityID === a.ActivityID) === i);
        setActivities(merged.sort((a, b) => (a.StartDate < b.StartDate ? 1 : -1)));
        setLoading(false);
      }, []);

      useEffect(() => { load(); }, []);

      const remove = async (id) => {
        if (!confirm('ยืนยันการลบกิจกรรมนี้?')) return;
        try {
          await apiFetch(`/api/activities/${id}`, { method: 'DELETE' });
          notify('ลบกิจกรรมสำเร็จ');
          load();
        } catch (e) {
          notify(e.message, 'error');
        }
      };

      if (loading) return <p className="text-gray-500 py-8 text-center">กำลังโหลด...</p>;

      return (
        <div>
          <div className="flex justify-end mb-4">
            <button onClick={() => { setEditing(null); setShowForm(true); }}
              className="rounded-xl bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-4 py-2.5 transition">
              + สร้างกิจกรรมใหม่
            </button>
          </div>
          <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-gray-600">
                <tr>
                  <th className="px-4 py-3">ชื่อกิจกรรม</th>
                  <th className="px-4 py-3">หมวดหมู่</th>
                  <th className="px-4 py-3">วันที่</th>
                  <th className="px-4 py-3">ผู้สมัคร</th>
                  <th className="px-4 py-3">สถานะ</th>
                  <th className="px-4 py-3"></th>
                </tr>
              </thead>
              <tbody>
                {activities.map(a => (
                  <tr key={a.ActivityID} className="border-t border-gray-100">
                    <td className="px-4 py-3 font-medium text-gray-900">{a.Title}</td>
                    <td className="px-4 py-3 text-gray-600">{CATEGORY_LABELS[a.Category] || a.Category}</td>
                    <td className="px-4 py-3 text-gray-600">{a.StartDate} — {a.EndDate}</td>
                    <td className="px-4 py-3 text-gray-600">{a.registered_count || 0}{a.MaxParticipants ? `/${a.MaxParticipants}` : ''}</td>
                    <td className="px-4 py-3">
                      <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-primary-50 text-primary-700">
                        {ACTIVITY_STATUS_LABEL[a.Status] || a.Status}
                      </span>
                    </td>
                    <td className="px-4 py-3 text-right whitespace-nowrap">
                      <button onClick={() => { setEditing(a); setShowForm(true); }} className="text-primary-600 hover:underline mr-3">แก้ไข</button>
                      <button onClick={() => remove(a.ActivityID)} className="text-red-600 hover:underline">ลบ</button>
                    </td>
                  </tr>
                ))}
                {activities.length === 0 && (
                  <tr><td colSpan="6" className="px-4 py-8 text-center text-gray-500">ยังไม่มีกิจกรรม</td></tr>
                )}
              </tbody>
            </table>
          </div>

          {showForm && (
            <ActivityFormModal
              activity={editing}
              onClose={() => setShowForm(false)}
              notify={notify}
              onSaved={() => { setShowForm(false); load(); }}
            />
          )}
        </div>
      );
    }

    // ───────────────────────── Registrations Tab ─────────────────────────
    function RegistrationsTab({ notify }) {
      const [regs, setRegs] = useState([]);
      const [statusFilter, setStatusFilter] = useState('pending');
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        const params = statusFilter ? `?status=${statusFilter}` : '';
        const data = await apiFetch(`/api/admin/registrations${params}`);
        setRegs(data);
        setLoading(false);
      }, [statusFilter]);

      useEffect(() => { load(); }, [statusFilter]);

      const act = async (id, action) => {
        try {
          await apiFetch(`/api/admin/registrations/${id}`, { method: 'PATCH', body: { action } });
          notify(action === 'approved' ? 'อนุมัติการสมัครแล้ว' : 'ปฏิเสธการสมัครแล้ว');
          load();
        } catch (e) {
          notify(e.message, 'error');
        }
      };

      return (
        <div>
          <div className="flex gap-2 mb-4">
            {['pending', 'approved', 'rejected', 'attended', 'cancelled', ''].map(s => (
              <button key={s} onClick={() => setStatusFilter(s)}
                className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${statusFilter === s ? 'bg-primary-600 text-white' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                {s ? REG_STATUS_LABEL[s] : 'ทั้งหมด'}
              </button>
            ))}
          </div>

          {loading ? <p className="text-gray-500 py-8 text-center">กำลังโหลด...</p> : (
            <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-gray-50 text-gray-600">
                  <tr>
                    <th className="px-4 py-3">ผู้สมัคร</th>
                    <th className="px-4 py-3">กิจกรรม</th>
                    <th className="px-4 py-3">วันที่สมัคร</th>
                    <th className="px-4 py-3">สถานะ</th>
                    <th className="px-4 py-3"></th>
                  </tr>
                </thead>
                <tbody>
                  {regs.map(r => (
                    <tr key={r.RegistrationID} className="border-t border-gray-100">
                      <td className="px-4 py-3">
                        <div className="font-medium text-gray-900">{r.UserName}</div>
                        <div className="text-gray-500 text-xs">{r.UserEmail}</div>
                      </td>
                      <td className="px-4 py-3 text-gray-700">{r.ActivityTitle}</td>
                      <td className="px-4 py-3 text-gray-600">{new Date(r.created_at).toLocaleDateString('th-TH')}</td>
                      <td className="px-4 py-3">
                        <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700">
                          {REG_STATUS_LABEL[r.Status] || r.Status}
                        </span>
                      </td>
                      <td className="px-4 py-3 text-right whitespace-nowrap">
                        {r.Status === 'pending' && (
                          <>
                            <button onClick={() => act(r.RegistrationID, 'approved')} className="text-green-600 hover:underline mr-3">อนุมัติ</button>
                            <button onClick={() => act(r.RegistrationID, 'rejected')} className="text-red-600 hover:underline">ปฏิเสธ</button>
                          </>
                        )}
                      </td>
                    </tr>
                  ))}
                  {regs.length === 0 && (
                    <tr><td colSpan="5" className="px-4 py-8 text-center text-gray-500">ไม่มีรายการ</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ───────────────────────── Verifications Tab ─────────────────────────
    function VerificationsTab({ notify }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [rejectingId, setRejectingId] = useState(null);
      const [reason, setReason] = useState('');

      const load = useCallback(async () => {
        setLoading(true);
        const data = await apiFetch('/api/verifications/pending');
        setItems(data);
        setLoading(false);
      }, []);

      useEffect(() => { load(); }, []);

      const approve = async (id) => {
        try {
          await apiFetch(`/api/verifications/${id}/review`, { method: 'PATCH', body: { approve: true } });
          notify('ยืนยันการเข้าร่วมและบันทึกชั่วโมงแล้ว');
          load();
        } catch (e) {
          notify(e.message, 'error');
        }
      };

      const reject = async (id) => {
        try {
          await apiFetch(`/api/verifications/${id}/review`, { method: 'PATCH', body: { approve: false, reason } });
          notify('ปฏิเสธรูปยืนยันแล้ว');
          setRejectingId(null);
          setReason('');
          load();
        } catch (e) {
          notify(e.message, 'error');
        }
      };

      if (loading) return <p className="text-gray-500 py-8 text-center">กำลังโหลด...</p>;

      return (
        <div className="space-y-3">
          {items.length === 0 && <p className="text-center text-gray-500 py-16">ไม่มีรูปที่รอตรวจสอบ</p>}
          {items.map(v => (
            <div key={v.VerificationID} className="bg-white rounded-2xl border border-gray-200 p-4 flex flex-col sm:flex-row gap-4">
              <div className="flex-1">
                <div className="font-medium text-gray-900">{v.UserName} — {v.Title}</div>
                <div className="text-sm text-gray-500 mt-1">
                  ระยะห่างจากพิกัดกิจกรรม: {v.DistanceMeters != null ? `${Math.round(v.DistanceMeters)} เมตร` : 'ไม่พบพิกัด GPS ในรูป'}
                </div>
                <div className="text-sm text-gray-500">ถ่ายเมื่อ: {v.ExifTakenAt ? new Date(v.ExifTakenAt).toLocaleString('th-TH') : 'ไม่ทราบ'}</div>

                {rejectingId === v.VerificationID ? (
                  <div className="mt-3 flex gap-2">
                    <input value={reason} onChange={e => setReason(e.target.value)} placeholder="เหตุผลที่ปฏิเสธ"
                      className="flex-1 rounded-lg border border-gray-300 px-3 py-1.5 text-sm" />
                    <button onClick={() => reject(v.VerificationID)} className="rounded-lg bg-red-600 text-white text-sm px-3 py-1.5">ยืนยันปฏิเสธ</button>
                    <button onClick={() => setRejectingId(null)} className="rounded-lg border border-gray-300 text-sm px-3 py-1.5">ยกเลิก</button>
                  </div>
                ) : (
                  <div className="mt-3 flex gap-2">
                    <button onClick={() => approve(v.VerificationID)} className="rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-3 py-1.5">อนุมัติ</button>
                    <button onClick={() => setRejectingId(v.VerificationID)} className="rounded-lg border border-gray-300 text-sm font-medium px-3 py-1.5 hover:bg-gray-50">ปฏิเสธ</button>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ───────────────────────── Reports Tab ─────────────────────────
    function ReportsTab() {
      const [summary, setSummary] = useState(null);
      const [topActivities, setTopActivities] = useState([]);
      const [topUsers, setTopUsers] = useState([]);

      useEffect(() => {
        (async () => {
          const [s, a, u] = await Promise.all([
            apiFetch('/api/admin/reports/registrations'),
            apiFetch('/api/admin/reports/activities'),
            apiFetch('/api/admin/reports/users?limit=10'),
          ]);
          setSummary(s);
          setTopActivities(a.slice(0, 8));
          setTopUsers(u);
        })();
      }, []);

      if (!summary) return <p className="text-gray-500 py-8 text-center">กำลังโหลด...</p>;

      const cards = [
        { label: 'ลงทะเบียนทั้งหมด', value: summary.total_registrations },
        { label: 'รอการอนุมัติ', value: summary.pending },
        { label: 'อนุมัติแล้ว', value: summary.approved },
        { label: 'เข้าร่วมสำเร็จ', value: summary.attended },
      ];

      return (
        <div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            {cards.map(c => (
              <div key={c.label} className="bg-white rounded-2xl border border-gray-200 p-4">
                <div className="text-2xl font-bold text-gray-900">{c.value ?? 0}</div>
                <div className="text-sm text-gray-500 mt-1">{c.label}</div>
              </div>
            ))}
          </div>

          <h3 className="font-semibold text-gray-900 mb-3">กิจกรรมยอดนิยม</h3>
          <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto mb-6">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-gray-600">
                <tr><th className="px-4 py-3">กิจกรรม</th><th className="px-4 py-3">ผู้สมัคร</th><th className="px-4 py-3">เข้าร่วมสำเร็จ</th></tr>
              </thead>
              <tbody>
                {topActivities.map(a => (
                  <tr key={a.ActivityID} className="border-t border-gray-100">
                    <td className="px-4 py-3 font-medium text-gray-900">{a.Title}</td>
                    <td className="px-4 py-3 text-gray-600">{a.total_registrations}</td>
                    <td className="px-4 py-3 text-gray-600">{a.attended_count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <h3 className="font-semibold text-gray-900 mb-3">ผู้ที่สะสมชั่วโมงจิตอาสาสูงสุด</h3>
          <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50 text-gray-600">
                <tr><th className="px-4 py-3">ชื่อ</th><th className="px-4 py-3">คณะ/หน่วยงาน</th><th className="px-4 py-3">ชั่วโมงสะสม</th></tr>
              </thead>
              <tbody>
                {topUsers.map(u => (
                  <tr key={u.UserID} className="border-t border-gray-100">
                    <td className="px-4 py-3 font-medium text-gray-900">{u.Name}</td>
                    <td className="px-4 py-3 text-gray-600">{u.Faculty || '-'}</td>
                    <td className="px-4 py-3 text-gray-600">{u.total_hours}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ───────────────────────── Users Tab ─────────────────────────
    function UsersTab({ notify }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        const data = await apiFetch('/api/admin/users');
        setUsers(data);
        setLoading(false);
      }, []);

      useEffect(() => { load(); }, []);

      if (loading) return <p className="text-gray-500 py-8 text-center">กำลังโหลด...</p>;

      return (
        <div className="bg-white rounded-2xl border border-gray-200 overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 text-gray-600">
              <tr><th className="px-4 py-3">ชื่อ</th><th className="px-4 py-3">อีเมล</th><th className="px-4 py-3">บทบาท</th><th className="px-4 py-3">ชั่วโมงสะสม</th></tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.UserID} className="border-t border-gray-100">
                  <td className="px-4 py-3 font-medium text-gray-900">{u.Name}</td>
                  <td className="px-4 py-3 text-gray-600">{u.Email}</td>
                  <td className="px-4 py-3 text-gray-600">{u.Role}</td>
                  <td className="px-4 py-3 text-gray-600">{u.total_hours ?? 0}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ───────────────────────── App ─────────────────────────
    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('activities');
      const [toast, setToast] = useState({ message: '', type: 'success' });
      const [loading, setLoading] = useState(true);

      const notify = (message, type = 'success') => setToast({ message, type });

      useEffect(() => {
        (async () => {
          const u = await requireLogin(['admin']);
          if (!u) return;
          setUser(u);
          setLoading(false);
        })();
      }, []);

      if (loading) return <div className="min-h-screen flex items-center justify-center text-gray-500">กำลังโหลด...</div>;

      return (
        <div>
          <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🛠️</span>
                <h1 className="font-bold text-lg text-gray-900">Admin — เว็บรวมกิจกรรมจิตอาสา</h1>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-sm text-gray-700 hidden sm:block">{user?.name}</span>
                <button onClick={() => window.toggleTheme()} className="p-2 rounded-lg hover:bg-gray-100" aria-label="สลับธีมสี">🌓</button>
                <button onClick={() => window.logout()} className="text-sm font-medium text-red-600 hover:text-red-700">ออกจากระบบ</button>
              </div>
            </div>
          </header>

          <main id="main-content" className="max-w-6xl mx-auto px-4 py-6">
            <div className="flex gap-1 mb-6 border-b border-gray-200 overflow-x-auto">
              <TabButton active={tab === 'activities'} onClick={() => setTab('activities')}>กิจกรรม</TabButton>
              <TabButton active={tab === 'registrations'} onClick={() => setTab('registrations')}>การลงทะเบียน</TabButton>
              <TabButton active={tab === 'verifications'} onClick={() => setTab('verifications')}>ตรวจสอบรูปยืนยัน</TabButton>
              <TabButton active={tab === 'reports'} onClick={() => setTab('reports')}>รายงาน</TabButton>
              <TabButton active={tab === 'users'} onClick={() => setTab('users')}>ผู้ใช้งาน</TabButton>
            </div>

            {tab === 'activities' && <ActivitiesTab notify={notify} />}
            {tab === 'registrations' && <RegistrationsTab notify={notify} />}
            {tab === 'verifications' && <VerificationsTab notify={notify} />}
            {tab === 'reports' && <ReportsTab />}
            {tab === 'users' && <UsersTab notify={notify} />}
          </main>

          <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: 'success' })} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
